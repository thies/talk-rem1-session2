				<section data-markdown >
					<textarea data-template>
						## Scenario Modelling <span class="subtitle"><br>A forecasting technique, good for demonstrating principles.</span>
						* Identify k states of the world, asset returns if those states occur, and probability of each state occurring

						* Expected returns: `$\small E(X) =  \sum\limits^{i=k}_{i=1}p_iX_i$`
						* Standard deviation: `$\small \sigma_x = \sqrt{ \sum\limits^{k}_{i=1}p_i[X_i-E(X)]^2 } $`
						* Covariance for x and y: `$\small cov_{xy} = \sum\limits^{k}_{i=1}p_i[X_i-E(X)][Y_i-E(Y)]  $`
						* Correlation: `$\small \rho_{xy} = cov_{xy}/(\sigma_x\sigma_y) $`
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Modern portfolio theory <span class="subtitle"><br>Harry Markowitz (1952): Risk/return for portfolios of many assets.</span>
						* The expected return in a portfolio is the weighted average of expected asset returns
						* However,  portfolio risk depends upon
							- Individual asset risks ($\sigma$) and the weights of the assets in portfolio ($w$)
							- Covariances ($cov_{i,j}$): How much do returns of assets $i$ and $j$ move together?
						* Note that:
							- Covariances are calculated pairwise &ndash; *many* pairwise combinations as number of assets increases.
							- $cov_{i,j} = \rho_{i,j}\sigma_i\sigma_j $. If correlation between assets $\rho_{i,j} < 1$, risk diversification will occur.


					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## Portfolio Variance <span class="subtitle"><br>Asset variance on diagonal, *many* covariance terms off-diagonal</span>

						* `$ \sigma_p^2 = \sum\limits_{i=1}^{n} w_i^2\sigma^2_i + \sum\limits_{i=1}^n\sum\limits_{j<>i}^n w_iw_jcov_{ij} = \sum\limits_{i=1}^{n} w_i^2\sigma^2_i + \sum\limits_{i=1}^n\sum\limits_{j<>i}^n w_iw_j\rho_{ij}\sigma_i\sigma_j $`

						* `$ 	\sigma_p^2 = \begin{bmatrix}
						w_1^2\sigma^2_1       &   w_2w_1cov_{2,1}       & \dots     &   w_nw_1cov_{n,1}       \\
						w_1w_2cov_{1,2}       &   w_2^2\sigma^2_2      & \dots     &   w_2w_2cov_{n,2}       \\
						\vdots  &  \vdots   &   \vdots  &   \vdots  \\
						w_1w_ncov_{1,n}       &   w_2w_ncov_{2,n}       & \dots     &   w_n^2\sigma^2_n       \\  \end{bmatrix}$`


					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## Two asset portfolio <span class="subtitle"><br>From previous slide: `$\small \sigma_p^2 =  \sum\limits_{i=1}^{n} w_i^2\sigma^2_i + \sum\limits_{i=1}^n\sum\limits_{j<>i}^n w_iw_j\rho_{ij}\sigma_i\sigma_j $`</span>
						* Two assets, x and y
							- `$\small \sigma_p^2 =  w_x^2\sigma^2_x + w_y^2\sigma^2_y + 2w_xw_y\rho_{xy}\sigma_x\sigma_y $`
							- `$\small \sigma_p^2 =  (w_x\sigma_x)^2 + (w_y\sigma_y)^2 + 2w_xw_y\rho_{xy}\sigma_x\sigma_y $`
						* Special case of perfect correlation: `$\small \rho_{xy} = +1$`
							- `$\small \sigma_p^2 =  (w_x\sigma_x)^2 + (w_y\sigma_y)^2 + 2w_xw_y\sigma_x\sigma_y $`
							- `$\small \sigma_p^2 =  (w_x\sigma_x + w_y\sigma_y)^2 $`
							- `$\small \sigma_p =  w_x\sigma_x + w_y\sigma_y$`
						* **This is just a weighted average.**
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Two asset portfolio <span class="subtitle"><br>From previous slide: `$\small \sigma_p^2 =  \sum\limits_{i=1}^{n} w_i^2\sigma^2_i + \sum\limits_{i=1}^n\sum\limits_{j<>i}^n w_iw_j\rho_{ij}\sigma_i\sigma_j $`</span>
						* Two assets, x and y
							- `$\small \sigma_p^2 =  w_x^2\sigma^2_x + w_y^2\sigma^2_y + 2w_xw_y\rho_{xy}\sigma_x\sigma_y $`
							- `$\small \sigma_p^2 =  (w_x\sigma_x)^2 + (w_y\sigma_y)^2 + 2w_xw_y\rho_{xy}\sigma_x\sigma_y $`
						* Special case of perfect negative correlation: `$\small \rho_{xy} = -1$`
							- `$\small \sigma_p^2 =  (w_x\sigma_x)^2 + (w_y\sigma_y)^2 - 2w_xw_y\sigma_x\sigma_y $`
							- `$\small \sigma_p^2 =  (w_x\sigma_x - w_y\sigma_y)^2 $`
							- `$\small \sigma_p =  w_x\sigma_x - w_y\sigma_y$`
						* **This is definitely NOT a weighted average!**
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Total diversification? <span class="subtitle"><br>Are there weights for w<sub>x</sub>, w<sub>y</sub> that will lead to a riskless portfolio? </span>
						* In case of perfect negative correlation
							- `$\small \sigma_p =  w_x\sigma_x - w_y\sigma_y$`
						* Now set
							- `$\small w_x/w_y = \sigma_y/\sigma_x $`
							- So that: $ \small w_x = w_y \sigma_y/\sigma_x $
						* And plug back into equation at top of slide:
							- `$\small \sigma_p = w_x\sigma_x - w_y\sigma_y = ( w_y \sigma_y/\sigma_x)\sigma_x - w_y\sigma_y =  w_y \sigma_y - w_y\sigma_y = 0$`
						* With perfect negative correlation, there is a riskless portfolio &mdash; at least theoretically.
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
					## De-Smoothing <span class="subtitle"><br/>Band-aid for valuation based indices.</span>

					* We first model the outcome of the valuations as a moving average process.
					* The smoothed return $r_t$ is a weighted average of previous return $r_{t-1}$ and the "true" return $r\text{*}_t$.
						- $ r_t = \alpha r_{t-1} + (1 - \alpha)r\text{*}_t $
						- The parameter $\alpha$ describes the weight on previous return.
					* We can re-arrange, solve for $ r\text{*}_t $
						- `$ r\text{*}_t =  \frac{r_t - \alpha r_{t-1}} { 1 - \alpha} $`
					* De-smoothing is based on the assumption that returns are moving averages.
						- Do we know it is the right abstraction? Not really, but it works...
						- Correction takes 2 minutes in a <a href="https://docs.google.com/spreadsheets/d/1ePF63vfDc36OmGbQql2ANPOJChzqtKRrZCO7Qtjwsu8/edit?usp=sharing">spreadsheet</a>.

						## Today's Lecture<span class="subtitle"><br>Structure</span>

						1. Systematic vs. unsystematic risk

				<section data-markdown >
					<textarea data-template>
						## Systematic vs. speciﬁc risk <span class="subtitle"><br> Naïve diversiﬁcation as a starting point for risk-return trade-off</span>

						* We have seen that combining assets may diversify away risk (speciﬁc asset-level risk only)
						* Suppose we have no additional information…
							- ...then we might equally weight each asset in the portfolio, that is $w_i = \frac{1}{n}$
						* Remember: `$ \sigma_p^2 = \sum\limits_{i=1}^{n} w_i^2\sigma^2_i + \sum\limits_{i=1}^n\sum\limits_{j<>i}^n w_iw_jcov_{ij} $`
						* What are the implications for portfolio risk as the size of the portfolio increases?
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Naïve diversiﬁcation<span class="subtitle"><br>Adding many assets to portfolio</span>

						* `$ \sigma_p^2 =  \sum\limits_{i=1}^{n} w_i^2\sigma^2_i + \sum\limits_{i=1}^n\sum\limits_{j<>i}^n w_iw_jcov_{ij} $`
						* Now, consider the ﬁrst term $\sum\limits_{i=1}^{n} w_i^2\sigma^2_i$
							- Set $w_i = \frac{1}{n}$
							- As $n$ increases, term reduces to 1/n times the average asset variance
						* As $n$ tends to inﬁnity, the term tends to zero
							- `$\sum\limits_{i=1}^{n} w_i^2\sigma^2_i = \sum\limits_{i=1}^{n} \frac{1}{n} \frac{1}{n}\sigma^2_i  = \frac{1}{n} \sum\limits_{i=1}^{n} \frac{1}{n}\sigma^2_i = \frac{1}{n} \frac{ \sum\limits_{i=1}^{n}\sigma^2_i}{n} = \frac{1}{n} \bar{\sigma}^2$`
						* So, as portfolio size increases, so impact of individual risk on portfolio risk reduces.
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Naïve diversiﬁcation<span class="subtitle"><br>Adding many assets to portfolio</span>

						* `$ \sigma_p^2 =  \sum\limits_{i=1}^{n} w_i^2\sigma^2_i + \sum\limits_{i=1}^n\sum\limits_{j<>i}^n w_iw_jcov_{ij} $`
						* The second term is more complex, due to the double summation
							- `$ \sum\limits_{i=1}^n\sum\limits_{j<>i}^n w_iw_jcov_{ij} =  \sum\limits_{i=1}^n\sum\limits_{j<>i}^n \frac{1}{n} \frac{1}{n} cov_{ij} =  \frac{1}{n} \frac{1}{n} \sum\limits_{i=1}^n\sum\limits_{j<>i}^n cov_{ij} $`
							- <mark>Note that there are $n(n-1)$ terms since $i≠j$, thus $ \sum\limits_{i=1}^n\sum\limits_{j<>i}^n cov_{ij} = n(n-1) \overline{cov} $</mark>
						* We can rewrite `$\frac{1}{n} \frac{1}{n} \sum\limits_{i=1}^n\sum\limits_{j<>i}^n cov_{ij} = \frac{1}{n} \frac{1}{n} n(n-1) \overline{cov} = \frac{n-1}{n}\overline{cov}$`
						* Thus, as $n$ increases, the second term tends to the average covariance, since
$\frac{n-1}{n}$ tends to 1.
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Convergence... <span class="subtitle"><br>... on average covariance as portfolio size increases.</span>

						* Here, 10-asset portfolio already diversiﬁes most of speciﬁc risk.

				<section data-markdown >
					<textarea data-template>
						## Reward for Risk<span class="subtitle"><br>“If it is so easy to get rid of speciﬁc risk, then...”</span>

						* In efficient markets, investors will behave rationally and diversify away speciﬁc risk
							- Thus, there is no reason why an investor should be rewarded for speciﬁc risk.
						* Systematic risk cannot be diversiﬁed away
							- Exposure to systematic risk should bring reward.
						* Key insight: Return is a reward for SYSTEMATIC risk only.
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Capital Asset Pricing Model<span class="subtitle"><br>Principles</span>

						* Investors start with choice of risky assets and construct the Markowitz eﬃcient frontier (previous Lecture)
						* In addition, a risk free asset is added to the universe of investable assets.
						* Investor portfolios are a mix of
							- The risk free asset.
							- Risky asset(s)
						* Borrowing at the risk free rate extends set of combinations
						* Under these assumptions, the eﬃcient frontier becomes a straight line.
						* The new eﬃcient frontier intersects with the risky set at the Market Portfolio.

					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Expected return <span class="subtitle"><br>All portfolios will be on CML</span>

						<img src="imgs/capm8.png" height=350>

						* So, we can express return as a function of risk ($\sigma_p$): `$\small E(R_p) = R_f + \frac{R_m-R_f}{\sigma_M} \sigma_p$`
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Derive CAPM <span class="subtitle"><br>Capital Asset Pricing Model</span>

						* This is one version (but not the famous one!) of the CAPM: `$\small E(R_p) = R_f + \frac{R_m-R_f}{\sigma_M} \sigma_p$`

						* Two assets in any portfolio on CML: *R<sub>f</sub>* and *M*.
						 	- covariance of any asset with *R<sub>f</sub>* is 0.
							- The only covariance that matters is covariance with market: cov(R<sub>i</sub>, R<sub>M</sub>)
						* Problem with covariance as measure of risk: Scaled by variance of market.
							- remove variance of market from risk measure: Divide by *var<sub>M</sub>* and call the ratio `$\beta = \frac{cov(R_i, R_M)}{\sigma_M^2}$`


					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## Security Market Line (SML)<span class="subtitle"><br>Derived from CML, focus on systematic risk ($\beta$), not total risk ($\sigma$).</span>

						* `$\beta = \frac{cov(R_i, R_M)}{\sigma_M^2}$`
							- for $R_f$, beta is 0 (cov = 0 with risk-free asset!)
							- for $R_M$, $cov(R_M, R_M) = \sigma_M^2$, thus beta simplifies to 1.
						* Redraw previous plot with beta as the measure of (systematic) risk:

						<img src="imgs/sml.png" height=200>

						* `$\small E(R) = R_f + \frac{R_m-R_f}{1}\beta$`, which simplifies to  <mark>`$ \small E(R) = R_f + \beta (R_m-R_f)$`</mark>
					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## Beta/Risk<span class="subtitle"><br>(continued)</span>

						* Beta measures the sensitivity of each asset to the market (systematic) risk factor.
						* Assets with $\beta > 1$ carry more systematic risk than market
							- Investors will demand higher returns to compensate
						* Asset risk has two components: `$ \small \sigma_i^2 = \beta_i^2 \sigma_m^2 + \sigma_e^2$`
						* The second, residual, component is not rewarded.
					</textarea>
				</section>
				<section data-markdown >
					<textarea data-template>
						## Example<span class="subtitle"><br>Magnitude of unrewarded risk in single asset (basic calculation of required return)</span>

						* Assume that the MRP is 5%, the risk free rate is 4.5% and a ﬁrm’s beta is 1.4 &ndash; what is the expected return of that ﬁrm according to CAPM?
							- `$E(R_i) = R_f + \beta_i MRP$`
							- `$E(R_i) = 4.5 + 1.4 (5) = 4.5 + 7.0 = 11.5%$`
						* Assume the ﬁrm’s returns have a standard deviation of 26% and the market standard deviation is 16%. How much unrewarded residual risk is there?
							- `$\sigma_i^2 = \beta_i^2\sigma_m^2 + \sigma_e^2$`,  for unrewarded residual risk rearrange to  $\sigma_e^2 = \sigma_i^2 - \beta_i^2 \sigma_m^2$
							- $26^2 - 1.4^2 16^2 = 676 - 501.76 = 174.24$ <br>(174.24 / 676 = 0.258 or a quarter of the risk)
					</textarea>
				</section>
				<section data-markdown >
					<textarea data-template>
						## Risk-adjusted performance<span class="subtitle"><br>Measures that put risk and return into perspective:</span>

						<span class="smalltable">

						|  |  |  |
						|:---| :---: |:---|
						|**Sharpe Measure** <br> $\small Sharpe = \frac{\overline{X}-R_f}{\sigma}$ <br><br> | | - Divides excess return by total risk.<br>- Meaningful measure for well diversiﬁed portfolios.|
						|**Treynor Measure** <br> $ \small Treynor = \frac{\overline{X}-R_f}{\beta}$ <br><br>| | - Divides excess return by systematic risk.<br>- Does not assume full diversiﬁcation. |
						|**Jensen’s Alpha** <br> $\small \alpha = \overline{X} - [R_f + \beta \times MRP] $| |- What is expected return?<br>- Is actual return higher?|

						</div>
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## CAPM<span class="subtitle"><br>Discussion of assumptions</span>

						* CAPM has exacting theoretical assumptions:
							- Investors seek to maximise utility of final wealth
							- Investors’ decisions are based on risk and return
							- Investors have homogeneous expectations of risk & return
							- Investors have identical time horizons
							- Information is freely & simultaneously available to all
							- There is a risk free asset; investors may borrow and lend unlimited amounts of that asset
							- No taxes, transaction costs or market imperfections
							- All assets are marketable and divisible.
						* How likely is it that these assumptions apply? In general and in real estate in particular?
						* How robust is CAPM to their violation?
					</textarea>
				</section>
